name: Validate
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Verify repository and protocol
        run: |
          python tools/privacy_guard.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_protocol.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify bundled icon assets offline
        run: python tools/verify_assets.py
      - name: Test publication and privacy gates
        run: python -m unittest discover -s tools/verification
      - name: Restore locked dependencies
        run: dotnet restore Hourstone.Companion.slnx --locked-mode
      - name: Build
        run: dotnet build Hourstone.Companion.slnx -c Release --no-restore
      - name: Test core and application
        run: dotnet test Hourstone.Companion.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Render themes, links, source states and full-row selection
        run: ./tools/render-smoke.ps1 -Extended
      - name: Verify unsigned local packaging
        run: ./tools/package.ps1 -Unsigned
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-validation
          path: |
            artifacts/renders/*.png
            artifacts/renders/*.checks.json
            artifacts/package-renders/*.png
            artifacts/portable-renders/*.png
            artifacts/test-results/*.trx
            artifacts/releases/release-manifest.json
          if-no-files-found: ignore
